version: "3.9"

volumes:
  HNG-nginx-logs:
  nextcloud-data:
  nextcloud-db:

networks:
  internal:
    driver: bridge

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - nextcloud-db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nextcloudpassword}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nextcloud:
    image: kefaslungu/hng-nextcloud
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - nextcloud-data:/var/www/html
      - HNG-nginx-logs:/var/log/nginx:ro
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nextcloudpassword}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-adminpassword}
      NEXTCLOUD_TRUSTED_DOMAINS: ${SERVER_IP:-localhost}
      # HNG grading agent — built into the image; optional Slack webhook
      INUXIUS_SLACK_WEBHOOK: ${INUXIUS_SLACK_WEBHOOK:-}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - HNG-nginx-logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - nextcloud
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  detector:
    build: ./detector
    restart: unless-stopped
    network_mode: host
    volumes:
      - HNG-nginx-logs:/var/log/nginx:ro
    cap_add:
      - NET_ADMIN
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SERVER_IP: ${SERVER_IP:-}
    depends_on:
      - nginx
