user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # Trust X-Forwarded-For from any upstream (Nextcloud, load balancers, etc.)
    set_real_ip_from  0.0.0.0/0;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    log_format json_combined escape=json
        '{'
            '"source_ip":"$realip_remote_addr",'
            '"timestamp":"$time_iso8601",'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"status":$status,'
            '"response_size":$body_bytes_sent,'
            '"http_host":"$host",'
            '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/hng-access.log json_combined;

    sendfile        on;
    keepalive_timeout  65;

    # Docker's internal DNS — resolves upstream at request time, not at startup
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Dashboard — metrics subdomain routes to detector on host port 8080
    server {
        listen 80;
        server_name hngmetrics.unicornocean.ai;

        location / {
            proxy_pass         http://host.docker.internal:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $realip_remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30;
        }
    }

    # Nextcloud — all other traffic (access by IP)
    server {
        listen 80 default_server;
        server_name _;

        location / {
            set $upstream http://nextcloud:80;
            proxy_pass         $upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $realip_remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            client_max_body_size 512M;
        }
    }
}
